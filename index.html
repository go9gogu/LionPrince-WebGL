<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | LionPrince</title>
		<style>
			html,
			body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: black;
			}

			#unity-canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			}
		</style>
  </head>
	<body>
		<canvas
		  id="unity-canvas"
		  tabindex="-1"
		  style="background: #231F20">
		</canvas>
    <script src="Build/LionPrince.loader.js"></script>
    <script>
		if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
		// Mobile device style: fill the whole browser client area with the game canvas:
		var meta = document.createElement('meta');
		meta.name = 'viewport';
		meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
		document.getElementsByTagName('head')[0].appendChild(meta);

		}

		createUnityInstance(document.querySelector("#unity-canvas"), {
		arguments: [],
		dataUrl: "Build/LionPrince.data",
		frameworkUrl: "Build/LionPrince.framework.js",
		codeUrl: "Build/LionPrince.wasm",
		streamingAssetsUrl: "StreamingAssets",
		companyName: "GO9",
		productName: "LionPrince",
		productVersion: "1.0",
		// matchWebGLToCanvasSize: true, // Uncomment this to separately control WebGL canvas render size and DOM element size.
		// devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
		}).then((unityInstance) => {
		}).catch((message) => {
		alert(message);
		});
	</script>
  </body>
</html>
